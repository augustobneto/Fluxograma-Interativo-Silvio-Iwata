header{height:70px;background:#fff;border-bottom:1px solid #dfe3e8;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;position:relative;z-index:5}

#viewport{position:absolute;inset:70px 0 0;overflow:auto;background:#fff;overscroll-behavior:contain}

<script>
(()=>{
const F=JSON.parse(document.getElementById('flow-data').textContent);

// Keep the exact relative arrangement from the PDF, but add a safe outer margin
// and expand the canvas when the original coordinates exceed its declared size.
const minX=Math.min(...F.nodes.map(n=>n.x));
const minY=Math.min(...F.nodes.map(n=>n.y));
const shiftX=Math.max(0,30-minX);
const shiftY=Math.max(0,30-minY);
F.nodes.forEach(n=>{n.x+=shiftX;n.y+=shiftY});

// Preserve complete words. Boxes that need more lines grow vertically while
// keeping the same center, so the overall structure remains aligned.
const hasOutgoing=new Set(F.edges.map(e=>e.from));
function displayTokens(text){
 return text.replaceAll('/','/ ').split(/\s+/).filter(Boolean);
}
function tokenWidth(token,fontSize=10){
 let width=0;
 for(const ch of token){
   width+=/[A-ZÁÀÂÃÉÊÍÓÔÕÚÇMW]/.test(ch)?6.2:/[ilI1.,:;!?]/.test(ch)?2.8:5.15;
 }
 return width*(fontSize/10);
}
function estimatedLines(text,available,fontSize=10){
 const tokens=displayTokens(text);let lines=1,current=0;
 for(const token of tokens){
   const w=tokenWidth(token,fontSize),space=current?3.2:0;
   if(current&&current+space+w>available){lines++;current=w}else current+=space+w;
 }
 return lines;
}
for(const n of F.nodes){
 const expandable=hasOutgoing.has(n.id)&&n.kind!=='terminal';
 let available=n.w-(expandable?31:16);
 if(n.kind==='decision')available=n.w*.56;
 if(n.kind==='source')available-=4;
 const font=n.kind==='decision'?9.4:10;
 const lines=estimatedLines(n.label,Math.max(34,available),font);
 const lineHeight=font*1.16;
 const needed=Math.ceil(lines*lineHeight+(n.kind==='decision'?18:14));
 const maxNeeded=n.kind==='decision'?Math.max(n.h,needed):Math.max(n.h,needed);
 if(maxNeeded>n.h){const delta=maxNeeded-n.h;n.y-=delta/2;n.h=maxNeeded;}
}
// Open extra room between boxes where a "SIM" label must sit directly over the
// original connection line. This keeps the line straight and brings the label
// down to the line instead of routing the line upward to the label.
function centerYOf(n){return n.y+n.h/2}
function shiftRowAfter(anchorId,delta){
 const anchor=F.nodes.find(n=>n.id===anchorId); if(!anchor)return;
 const rowY=centerYOf(anchor);
 for(const n of F.nodes){
   if(n.id===anchorId) continue;
   if(Math.abs(centerYOf(n)-rowY)<=24 && n.x>anchor.x) n.x+=delta;
 }
}

function simplify(points){
 const clean=[];
 for(const p of points){

   if(last&&last.x===p.x&&last.y===p.y)continue;
   if(clean.length>=2){

}

function activeEdge(e){return expanded.has(e.from)&&visible.has(e.to)}

 start:new Set(F.edges.filter(e=>e.from==='start'&&e.kind==='normal').map(e=>e.to)),
 cliente:new Set(F.edges.filter(e=>e.from==='cliente'&&e.kind==='normal').map(e=>e.to)),
 necessidade:new Set(F.edges.filter(e=>e.from==='necessidade'&&e.kind==='normal').map(e=>e.to)),
 perfil_prime:new Set(F.edges.filter(e=>e.from==='perfil_prime'&&e.kind==='normal').map(e=>e.to))
};
const collectorGroups={
 contato:new Set(F.edges.filter(e=>e.to==='contato'&&e.kind==='normal').map(e=>e.from)),
 triagem:new Set(F.edges.filter(e=>e.to==='triagem'&&e.kind==='normal').map(e=>e.from)),
 resolver:new Set(F.edges.filter(e=>e.to==='resolver'&&e.kind==='normal').map(e=>e.from))
};
const groupedEdges=new Set();
for(const [source,targets] of Object.entries(fanoutGroups)){
 F.edges.forEach(e=>{if(e.from===source&&targets.has(e.to)&&e.kind==='normal')groupedEdges.add(e.i)});
}
for(const [target,sources] of Object.entries(collectorGroups)){
 F.edges.forEach(e=>{if(e.to===target&&sources.has(e.from)&&e.kind==='normal')groupedEdges.add(e.i)});
}
function fanoutTrunkX(id){
 const n=nodeMap.get(id),r=n.x+n.w;
 if(id==='cliente')return r+23;
 if(id==='necessidade')return r+30;
 if(id==='perfil_prime')return r+35;
 const targets=[...fanoutGroups[id]].map(t=>nodeMap.get(t));
 return (r+Math.min(...targets.map(t=>t.x)))/2;
}
function collectorTrunkX(id){
 const target=nodeMap.get(id);
 if(id==='contato')return target.x-35;
 if(id==='triagem')return target.x-20;
 if(id==='resolver')return target.x-45;
 return target.x-30;
}
function directRoute(e){
 const a=nodeMap.get(e.from),b=nodeMap.get(e.to);
 const s=anchor(a,'right'),t=anchor(b,'left');
 if(Math.abs(s.y-t.y)<1)return [s,t];
 const x=(s.x+t.x)/2;
 return [s,{x,y:s.y},{x,y:t.y},t];
}
function simRoute(e){
 const a=nodeMap.get(e.from),b=nodeMap.get(e.to);
 const s=anchor(a,'right'),t=anchor(b,'left');
 const x1=s.x+18, x2=t.x-18;
 // Create a dedicated corridor above or below the row so the "SIM" label can
 // sit right on its own connection instead of being pushed far away.
 const canGoAbove=a.y>24;
 const lane=(canGoAbove?Math.min(a.y,b.y)-16:Math.max(a.y+a.h,b.y+b.h)+16);
 if(Math.abs(s.y-t.y)<1){
   return simplify([s,{x:x1,y:s.y},{x:x1,y:lane},{x:x2,y:lane},{x:x2,y:t.y},t]);
 }
 // For slightly misaligned forward edges, keep the corridor but meet the target cleanly.
 return simplify([s,{x:x1,y:s.y},{x:x1,y:lane},{x:x2,y:lane},{x:x2,y:t.y},t]);
}
function gapLanes(upper,lower){
 const top=upper.y+upper.h,bottom=lower.y,gap=Math.max(12,bottom-top);
 return [top+gap*.32,top+gap*.72];
}
function feedbackPair(decisionId,supportId,targetId,supportAbove){
 const decision=nodeMap.get(decisionId),support=nodeMap.get(supportId),target=nodeMap.get(targetId);
 const upper=supportAbove?support:decision;
 const lower=supportAbove?decision:support;
 const [laneDecision,laneBack]=gapLanes(upper,lower);
 const supportRight=anchor(support,'right');
 const side=supportAbove?'top':'bottom';
 const source=anchor(decision,side);
 const first=[source,{x:source.x,y:laneDecision},{x:supportRight.x+12,y:laneDecision},{x:supportRight.x+12,y:supportRight.y},supportRight];
 const supportPort=anchor(support,supportAbove?'bottom':'top');
 const targetPort=anchor(target,supportAbove?'top':'bottom');
 const second=[supportPort,{x:supportPort.x,y:laneBack},{x:targetPort.x,y:laneBack},targetPort];
 return{first:simplify(first),second:simplify(second)};
}
const feedbackRoutes=new Map();
function setFeedback(from,to,points){feedbackRoutes.set(`${from}->${to}`,simplify(points))}

// Feedback pair: rent search.
{
 const r=feedbackPair('alu_4','alu_ajuste','alu_2',true);
 setFeedback('alu_4','alu_ajuste',r.first);setFeedback('alu_ajuste','alu_2',r.second);
}
// Feedback pair: third-party purchase search.
{
 const r=feedbackPair('comp_4','comp_ajuste','comp_2',false);
 setFeedback('comp_4','comp_ajuste',r.first);setFeedback('comp_ajuste','comp_2',r.second);
}
// Feedback pair: property sale expectations.
{
 const r=feedbackPair('ven_3','ven_alinha','ven_2',true);
 setFeedback('ven_3','ven_alinha',r.first);setFeedback('ven_alinha','ven_2',r.second);
}
// Feedback pair: rental conditions.
{
 const r=feedbackPair('loc_3','loc_alinha','loc_2',true);
 setFeedback('loc_3','loc_alinha',r.first);setFeedback('loc_alinha','loc_2',r.second);
}
function sameRowLoop(from,to,side,offset){
 const a=nodeMap.get(from),b=nodeMap.get(to);
 const s=anchor(a,side),t=anchor(b,side);
 const lane=side==='top'?Math.min(a.y,b.y)-offset:Math.max(a.y+a.h,b.y+b.h)+offset;
 return simplify([s,{x:s.x,y:lane},{x:t.x,y:lane},t]);
}
setFeedback('alu_8','alu_6',sameRowLoop('alu_8','alu_6','bottom',24));
setFeedback('alu_10','alu_9',sameRowLoop('alu_10','alu_9','bottom',42));
setFeedback('comp_7','comp_6',sameRowLoop('comp_7','comp_6','top',24));
setFeedback('comp_9','comp_8',sameRowLoop('comp_9','comp_8','top',42));
setFeedback('prime_6','prime_5',sameRowLoop('prime_6','prime_5','bottom',24));
setFeedback('prime_8','prime_7',sameRowLoop('prime_8','prime_7','bottom',42));
setFeedback('ven_9','ven_8',sameRowLoop('ven_9','ven_8','bottom',24));
setFeedback('loc_9','loc_8',sameRowLoop('loc_9','loc_8','bottom',24));

// Launch flow has two decisions feeding the same support box. Each connection
// uses a different side/corridor, and the return leaves from the left side.
{
 const a=nodeMap.get('lanc_4'),b=nodeMap.get('lanc_5'),o=nodeMap.get('lanc_opcoes'),t=nodeMap.get('lanc_1');
 const aStart=anchor(a,'bottom'),bStart=anchor(b,'bottom');
 const laneA=aStart.y+7,laneB=bStart.y+13;
 const topA={x:o.x+28,y:o.y};
 setFeedback('lanc_4','lanc_opcoes',[aStart,{x:aStart.x,y:laneA},{x:topA.x,y:laneA},topA]);
 const right=anchor(o,'right');
 setFeedback('lanc_5','lanc_opcoes',[bStart,{x:bStart.x,y:laneB},{x:right.x+12,y:laneB},{x:right.x+12,y:right.y},right]);
 const left=anchor(o,'left'),target=anchor(t,'bottom'),x=left.x-28,lane=o.y-15;
 setFeedback('lanc_opcoes','lanc_1',[left,{x,y:left.y},{x,y:lane},{x:target.x,y:lane},target]);
}
function routeEdge(e){
 if(e.kind==='return')return feedbackRoutes.get(edgeKey(e))||directRoute(e);
 if(e.label==='SIM')return directRoute(e);
 return directRoute(e);
}
const occupiedLabelRects=[];
function segmentHitsRect(a,b,r,pad=1){
 const rr={x:r.x-pad,y:r.y-pad,w:r.w+pad*2,h:r.h+pad*2};
 if(a.x===b.x){
   const y1=Math.min(a.y,b.y),y2=Math.max(a.y,b.y);
   return a.x>=rr.x&&a.x<=rr.x+rr.w&&y2>=rr.y&&y1<=rr.y+rr.h;
 }
 if(a.y===b.y){
   const x1=Math.min(a.x,b.x),x2=Math.max(a.x,b.x);
   return a.y>=rr.y&&a.y<=rr.y+rr.h&&x2>=rr.x&&x1<=rr.x+rr.w;
 }
 return false;
}
function rectHitsAnyPath(r,paths){
 for(const pts of paths){
   for(let i=0;i<pts.length-1;i++)if(segmentHitsRect(pts[i],pts[i+1],r,2))return true;
 }
 return false;
}
function safeLabelRect(r,allPaths,ignoredPaths=[]){
 if(r.x<3||r.y<3||r.x+r.w>F.width-3||r.y+r.h>F.height-3)return false;
 if(F.nodes.some(n=>rectsOverlap(r,{x:n.x-7,y:n.y-7,w:n.w+14,h:n.h+14})))return false;
 if(occupiedLabelRects.some(o=>rectsOverlap(r,{x:o.x-4,y:o.y-3,w:o.w+8,h:o.h+6})))return false;
 const filtered=ignoredPaths.length?allPaths.filter(p=>!ignoredPaths.includes(p)):allPaths;
 if(rectHitsAnyPath(r,filtered))return false;
 return true;
}
function nearLineCandidates(points,text,edge){
 const w=Math.max(25,text.length*6+10),h=16,candidates=[];
 const isNo=text==='NÃO', isSim=text==='SIM';
 const ratios=isNo?[.18,.3,.42,.56,.7]:(isSim?[.28,.4,.52,.64]:[.28,.42,.58,.72]);
 for(let i=0;i<points.length-1;i++){
   const a=points[i],b=points[i+1],horizontal=a.y===b.y;
   const len=Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
   if(len<14)continue;
   const isFirst=i===0, isLast=i===points.length-2;
   let priority=len + (isFirst?55:0) + (isLast?8:0);
   if(edge&&edge.kind==='return'){ if(isFirst) priority+=40; }
   if(edge&&edge.kind!=='return'&&isFirst) priority+=25;
   if(horizontal) priority+=18; else priority+=10;
   if(isSim){
     if(horizontal) priority+=150; // a SIM should sit above its horizontal line
     if(isFirst) priority+=20;
   }
   for(const ratio of ratios){
     const mx=a.x+(b.x-a.x)*ratio,my=a.y+(b.y-a.y)*ratio;
     if(horizontal){
       const offs=isNo?[-12,12,-20,20,-28,28]:(isSim?[-5,-7,-9,5,7]:[-12,12,-20,20]);
       for(const off of offs)candidates.push({x:mx,y:my+off,len,priority:priority-(Math.abs(ratio-.5)*6),seg:i});
     }else{
       const horizDir=(i>0?Math.sign(points[i].x-points[i-1].x):0)||(i<points.length-2?Math.sign(points[i+2].x-b.x):0)||1;
       const sideOrder=isNo?[12,-12,20,-20,28,-28]:(isSim?[6,-6,9,-9]:[12,-12,20,-20]);
       for(const base of sideOrder){
         const off=(horizDir<0?-1:1)*Math.abs(base)*(base<0?-1:1);
         candidates.push({x:mx+off,y:my,len,priority:priority-3-(Math.abs(ratio-.38)*8),seg:i});
       }
       if(isFirst && edge && edge.kind==='return'){
         const ex=a.x+(b.x-a.x)*.08;
         const near=isSim?8:14;
         candidates.push({x:ex+near,y:my, len:len+5, priority:priority+12, seg:i});
         candidates.push({x:ex-near,y:my, len:len+5, priority:priority+11, seg:i});
       }
     }
   }
 }
 candidates.sort((u,v)=>(v.priority-u.priority)||(v.len-u.len));
 return {candidates,w,h};
}
function labelPosition(points,text,allPaths=[],edge=null){
 const {candidates,w,h}=nearLineCandidates(points,text,edge);
 const ignoreOwnPath=text==='SIM' ? [points] : [];
 for(const p of candidates){
   const r={x:p.x-w/2,y:p.y-h/2,w,h};
   if(safeLabelRect(r,allPaths,ignoreOwnPath)){occupiedLabelRects.push(r);return{x:p.x,y:p.y};}
 }
 // Dedicated fallback for SIM: stay anchored to the first segment instead of
 // drifting away from the source connection.
 if(text==='SIM' && points.length>=2){
   const horizSeg=points.findIndex((p,i)=>i<points.length-1 && points[i].y===points[i+1].y && Math.abs(points[i+1].x-points[i].x)>=24);
   const idx=horizSeg>=0?horizSeg:0;
   const a=points[idx], b=points[idx+1], horizontal=a.y===b.y;
   const scanRatios=horizontal?[.32,.5,.68,.22,.78]:[.2,.35,.5,.65];
   const scanOffsets=horizontal?[-5,-7,-9,5,7]:[0,6,-6,10,-10];
   for(const ratio of scanRatios){
     const mx=a.x+(b.x-a.x)*ratio, my=a.y+(b.y-a.y)*ratio;
     for(const off of scanOffsets){
       const px=horizontal?mx:mx+off;
       const py=horizontal?my+off:my;
       const r={x:px-w/2,y:py-h/2,w,h};
       if(safeLabelRect(r,allPaths,ignoreOwnPath)){occupiedLabelRects.push(r);return{x:px,y:py};}
     }
   }
 }
 // Generic fallback: still search nearby, but remain around this line bundle instead of
 // drifting to unrelated areas.
 const bounds={
   minX:Math.min(...points.map(p=>p.x)),maxX:Math.max(...points.map(p=>p.x)),
   minY:Math.min(...points.map(p=>p.y)),maxY:Math.max(...points.map(p=>p.y))
 };
 const cx=(bounds.minX+bounds.maxX)/2,cy=(bounds.minY+bounds.maxY)/2;
 for(let radius=14;radius<=56;radius+=6){
   const probes=[
     {x:cx,y:bounds.minY-radius},{x:cx,y:bounds.maxY+radius},
     {x:bounds.minX-radius,y:cy},{x:bounds.maxX+radius,y:cy},
     {x:bounds.minX-radius,y:bounds.minY-radius},{x:bounds.maxX+radius,y:bounds.minY-radius},
     {x:bounds.minX-radius,y:bounds.maxY+radius},{x:bounds.maxX+radius,y:bounds.maxY+radius}
   ];
   for(const p of probes){
     const r={x:p.x-w/2,y:p.y-h/2,w,h};
     if(safeLabelRect(r,allPaths,ignoreOwnPath)){occupiedLabelRects.push(r);return{x:p.x,y:p.y};}
   }
 }
 return null;
}
function labelSvg(text,points,allPaths,edge){
 const p=labelPosition(points,text,allPaths,edge);if(!p)return;
 const w=Math.max(25,text.length*6+10);
 edgeSvg.append(el('rect',{x:p.x-w/2,y:p.y-8,width:w,height:16,rx:3,class:'edge-label-bg'}));
 const t=el('text',{x:p.x,y:p.y+.5,class:'edge-label'});t.textContent=text;edgeSvg.append(t);
}
function appendPath(points,classes='',arrow=true){
 const attrs={d:pathD(points),class:'edge '+classes};
 if(!arrow)attrs['marker-end']='none';
 edgeSvg.append(el('path',attrs));
}
function drawFanout(sourceId,active,allPaths,pendingLabels){
 const targets=fanoutGroups[sourceId];
 const edges=active.filter(e=>e.from===sourceId&&targets.has(e.to));
 if(!edges.length)return;
 const source=nodeMap.get(sourceId),s=anchor(source,'right'),x=fanoutTrunkX(sourceId);
 const targetPorts=edges.map(e=>({e,p:anchor(nodeMap.get(e.to),'left')}));
 const ys=[s.y,...targetPorts.map(v=>v.p.y)];
 const sourceLink=[s,{x,y:s.y}];
 const vertical=[{x,y:Math.min(...ys)},{x,y:Math.max(...ys)}];
 appendPath(sourceLink,'shared',false);appendPath(vertical,'shared',false);
 allPaths.push(sourceLink,vertical);
 for(const {e,p} of targetPorts){
   const branch=[{x,y:p.y},p];appendPath(branch,'',true);allPaths.push(branch);
   if(e.label)pendingLabels.push({text:e.label,points:branch,edge:e});
 }
}
function drawCollector(targetId,active,allPaths,pendingLabels){
 const sources=collectorGroups[targetId];
 const edges=active.filter(e=>e.to===targetId&&sources.has(e.from));
 if(!edges.length)return;
 const target=nodeMap.get(targetId),t=anchor(target,'left'),x=collectorTrunkX(targetId);
 const sourcePorts=edges.map(e=>({e,p:anchor(nodeMap.get(e.from),'right')}));
 const ys=[t.y,...sourcePorts.map(v=>v.p.y)];
 for(const {e,p} of sourcePorts){
   const branch=[p,{x,y:p.y}];appendPath(branch,'shared',false);allPaths.push(branch);
   if(e.label)pendingLabels.push({text:e.label,points:branch,edge:e});
 }
 const vertical=[{x,y:Math.min(...ys)},{x,y:Math.max(...ys)}];
 const targetLink=[{x,y:t.y},t];
 appendPath(vertical,'shared',false);appendPath(targetLink,'',true);
 allPaths.push(vertical,targetLink);
}
function drawEdges(){
 occupiedLabelRects.length=0;
 edgeSvg.replaceChildren();
 const defs=el('defs');
 const marker=el('marker',{id:'arrow',markerWidth:'7',markerHeight:'7',refX:'6.2',refY:'3.5',orient:'auto',markerUnits:'strokeWidth'});
 marker.append(el('path',{d:'M0,0 L7,3.5 L0,7 z',fill:'#222428'}));defs.append(marker);edgeSvg.append(defs);
 const active=F.edges.filter(activeEdge),allPaths=[],pendingLabels=[];
 for(const source of Object.keys(fanoutGroups))drawFanout(source,active,allPaths,pendingLabels);
 for(const target of Object.keys(collectorGroups))drawCollector(target,active,allPaths,pendingLabels);
 for(const e of active){
   if(groupedEdges.has(e.i))continue;
   const points=routeEdge(e);appendPath(points,e.kind==='return'?'return':'',true);allPaths.push(points);
   if(e.label)pendingLabels.push({text:e.label,points,edge:e});
 }
 // Labels are placed only after every connection exists, so they cannot be
 // hidden by a later line or positioned beneath a box.
 for(const item of pendingLabels)labelSvg(item.text,item.points,allPaths,item.edge);
}
function displayLabel(text){return text.replaceAll('/','/\u200b')}
function fitLabel(button,label,n){
 const hasNext=(out.get(n.id)||[]).length>0;
 let availW=n.w-(hasNext&&!button.classList.contains('terminal')?31:16);
 let availH=n.h-12;
 if(n.kind==='decision'){availW=n.w*.56;availH=n.h*.68}
 if(n.kind==='source')availW-=4;
 label.style.width=Math.max(28,availW)+'px';
 label.style.maxHeight=Math.max(18,availH)+'px';
 let size=n.kind==='decision'?9.4:10;
 label.style.fontSize=size+'px';
 label.style.lineHeight='1.16';
 // Only a small font adjustment is allowed; words are never cut or hyphenated.
 while(size>9&&(label.scrollHeight>availH+.5||label.scrollWidth>availW+.5)){
   size-=.1;label.style.fontSize=size+'px';
 }
 if(label.scrollHeight>availH+.5||label.scrollWidth>availW+.5){
   label.style.letterSpacing='-.08px';
 }
}
function drawNodes(){
 nodeLayer.replaceChildren();
 F.nodes.forEach(n=>{
   if(!visible.has(n.id))return;
   const p=phases[n.phase]||phases.consideracao;
   const b=document.createElement('button');
   b.type='button';b.className='node '+n.kind+(expanded.has(n.id)?' expanded':'');
   b.style.left=n.x+'px';b.style.top=n.y+'px';b.style.width=n.w+'px';b.style.height=n.h+'px';
   b.style.setProperty('--fill',p.fill);b.style.setProperty('--border',p.border);b.title=n.label;
   const label=document.createElement('span');label.className='label';label.textContent=displayLabel(n.label);b.append(label);
   const next=out.get(n.id)||[];
   if(next.length){const mark=document.createElement('span');mark.className='mark';mark.textContent=expanded.has(n.id)?'−':'▶';b.append(mark)}
   b.onclick=()=>toggleNode(n.id);nodeLayer.append(b);fitLabel(b,label,n);
 });
}
function recomputeVisible(){
 visible.clear();visible.add(F.root);
 const queue=[F.root],processed=new Set();
 while(queue.length){
   const id=queue.shift();if(processed.has(id))continue;processed.add(id);
   if(!expanded.has(id))continue;
   (out.get(id)||[]).forEach(e=>{visible.add(e.to);queue.push(e.to)});
 }
}
function toggleNode(id){
 const next=out.get(id)||[];
 if(!next.length){tip.textContent='Esta é uma etapa final.';return}
 if(expanded.has(id)){
   expanded.delete(id);recomputeVisible();render();
   tip.textContent='Ramificação recolhida. Clique novamente para reabrir.';return;
 }
 const before=new Set(visible);expanded.add(id);recomputeVisible();
 const added=[...visible].filter(nodeId=>!before.has(nodeId));render();
 tip.textContent=added.length?`${added.length} próxima(s) etapa(s) aberta(s)`:'Conexão desta etapa exibida';
 if(added.length)requestAnimationFrame(()=>focusNodes(added));
}
function focusNodes(ids){
 let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
 ids.forEach(id=>{const n=nodeMap.get(id);if(!n)return;minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);maxX=Math.max(maxX,n.x+n.w);maxY=Math.max(maxY,n.y+n.h)});
 if(!isFinite(minX))return;
 const left=minX*scale,top=minY*scale,right=maxX*scale,bottom=maxY*scale;
 const vx=viewport.scrollLeft,vy=viewport.scrollTop,vw=viewport.clientWidth,vh=viewport.clientHeight;
 if(left<vx+20||right>vx+vw-20)viewport.scrollLeft=Math.max(0,left-vw*.45);
 if(top<vy+20||bottom>vy+vh-20)viewport.scrollTop=Math.max(0,top-vh*.4);
}
function applyScale(){
 canvas.style.transform=`scale(${scale})`;stage.style.width=(F.width*scale)+'px';stage.style.height=(F.height*scale)+'px';
 document.getElementById('one').textContent=Math.round(scale*100)+'%';
}
function render(){drawEdges();drawNodes();applyScale()}
function reset(){
 expanded.clear();recomputeVisible();scale=.82;render();
 viewport.scrollTo(0,Math.max(0,(625+shiftY)*scale-viewport.clientHeight/2));
 tip.textContent='Clique em uma caixa para abrir; clique novamente para recolher';
}
function openAll(){
 F.nodes.forEach(n=>{if((out.get(n.id)||[]).length)expanded.add(n.id)});recomputeVisible();render();
 tip.textContent='Fluxograma completo aberto. Clique em qualquer caixa com − para recolher sua ramificação';
}
function fit(){
 scale=Math.min(.95,(viewport.clientWidth-24)/F.width,(viewport.clientHeight-24)/F.height);render();viewport.scrollTo(0,0);tip.textContent='Visão geral do fluxograma';
}
document.getElementById('reset').onclick=reset;
document.getElementById('all').onclick=openAll;
document.getElementById('fit').onclick=fit;
document.getElementById('plus').onclick=()=>{scale=Math.min(1.35,scale+.1);applyScale()};
document.getElementById('minus').onclick=()=>{scale=Math.max(.35,scale-.1);applyScale()};
document.getElementById('one').onclick=()=>{scale=1;applyScale()};
window.addEventListener('resize',applyScale);
reset();
})();
